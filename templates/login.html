<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTMB 抢票指挥官 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-title {
            color: #29549e;
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-login {
            background-color: #29549e;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            padding: 12px;
            transition: 0.3s;
        }
        .btn-login:hover {
            background-color: #1e3f7a;
            color: white;
        }
        .alert {
            border-radius: 8px;
            font-size: 14px;
        }
        .password-input {
            border-radius: 8px;
            padding: 12px 16px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="login-title">🚄 KTMB 抢票指挥官</h3>
        <p class="text-center text-muted mb-4">请输入管理密码以继续</p>

        {% if error %}
        <div class="alert alert-danger text-center" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <input type="password" class="form-control password-input" name="password"
                       placeholder="请输入密码" autofocus required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-login w-100">🔓 登录</button>
        </form>

        <p class="text-center text-muted mt-3" style="font-size: 12px;">
            默认密码: admin123<br>
            可通过环境变量 KTMB_WEB_PASSWORD 修改
        </p>
    </div>
</body>
</html>
